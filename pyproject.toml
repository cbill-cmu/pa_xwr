[project]
name = "pa_xwr"
version = "0.3.0"
description = "Automated power-consumption studies of TI mmWave radars using a Keysight N6705B DC power analyzer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bill Chang" }]
keywords = ["radar", "mmwave", "power", "AWR1843", "N6705B", "xwr"]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "xwr",
]

[project.urls]
Homepage = "https://github.com/cbill-cmu/pa_xwr"
Issues = "https://github.com/cbill-cmu/pa_xwr/issues"

[project.scripts]
rps-sweep    = "pa_xwr.sweep:_main"
rps-capture  = "pa_xwr.capture:_main"
rps-analyze  = "pa_xwr.analyze:_main"
rps-fft-zoom = "pa_xwr.FFT_zoom:_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------------
# uv-specific configuration for resolving the xwr dependency.
#
# Default: install xwr from GitHub so a public clone works with `uv sync`.
# For local xwr development, switch to:
#   xwr = { path = "../xwr", editable = true }
# -----------------------------------------------------------------------------
[tool.uv.sources]
xwr = { git = "https://github.com/RadarML/xwr.git" }
