study_name: low_frame_rate_x_frame_length
device: AWR1843

sweep:
  # The parameter we actually plot on the x-axis of the sweep curve.
  primary:
    param: frame_period
    values: [100.0, 50.0, 33.33, 25.0, 20.0, 16.667] #10, 20, 30, 40, 50, 60 Hz

  secondary:
    param: frame_length
    held_at: [64, 128]

  replicates: 3
  segment_duration: 30
  idle_between: 5

  order: random      