study_name: frame_period_sweep
device: AWR1843                  # filename in devices/ (without .yaml)

sweep:
  # The parameter you're varying.
  param: frame_period            # name from the device template
  values: [100, 50, 25, 20, 10]  # in the parameter's native units (ms)
                                 # corresponds to frame rates of 10, 20, 40, 50, 100 fps

  replicates: 3                  # override on CLI with --replicates if you want
  segment_duration: 30           # seconds of chirping per segment
  idle_between: 5                # seconds of idle between segments (thermal settle)

  order: random                  # random | sequential
                                 